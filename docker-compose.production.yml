services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: ./backend/.env
    ports: ["5000:5000"]
    environment:
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on: [redis]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["80:80"]
    restart: unless-stopped
    depends_on: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [cinemate_redis:/data]
volumes:
  cinemate_redis:
