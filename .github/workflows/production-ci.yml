name: CineMate CI
on:
  push:
    branches: ["main","production-readiness-31","scene-finder-production-hardening"]
  pull_request:
    branches: ["main"]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run build
      - run: npm run lint
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: backend/package.json}
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm test
